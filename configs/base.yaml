# Base diffusion LM: same shape and token budget as the Project 1 teacher (6 layers, width 384, 10,000 steps x
# 64 x 256 tokens = 164M tokens, same optimizer settings), so it can be compared with that autoregressive model.
run_name: mdlm_base
seed: 1337
model: {n_layer: 6, n_head: 6, n_embd: 384, block_size: 256, dropout: 0.1, bias: true, time_cond: false}
train:
  batch_size: 8
  grad_accum_steps: 8
  max_steps: 10000
  lr: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  betas: [0.9, 0.95]
  grad_clip: 1.0
  eval_interval: 500
  eval_windows: 800
  log_interval: 50
  ckpt_interval: 1000
  mask_schedule: linear
